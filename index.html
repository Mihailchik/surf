<meta name="apple-mobile-web-app-title" content="Surf">
<meta name="description" content="Waves, wind, tide and live cams for Phuket west coast beaches">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* Light is the base theme; dark is toggled and stored. */
:root{
  --bg:#f2f5f9; --card:#fff; --card2:#f7f9fc; --line:#e3e9f0;
  --tx:#0f1b2d; --dim:#4a5a6e; --dim2:#697a8e;
  --go:#00a5a5; --ok:#3d9b2f; --fair:#9d7c05; --mid:#e07a12; --bad:#d43a26; --no:#9aa8b8;
  --acc:#0b7fc7; --shadow:0 1px 2px rgba(15,27,45,.05),0 2px 10px rgba(15,27,45,.05);
}
:root[data-theme="dark"]{
  --bg:#0a0e14; --card:#121822; --card2:#0e141d; --line:#1e2836;
  --tx:#e8eef6; --dim:#94a3b8; --dim2:#8494a8;
  --go:#2fd8d8; --ok:#7ede4a; --fair:#f2d43a; --mid:#f79b3c; --bad:#f0604a; --no:#4a5568;
  --acc:#38b6ff; --shadow:none;
}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx)}
/* Thai glyphs render taller than Latin at the same size */
html[lang="th"] body{font-size:14px}
html[lang="th"] .vbig{font-size:19px}
html[lang="th"] .q i,html[lang="th"] .glab div,html[lang="th"] .met span,
html[lang="th"] .trow>span,html[lang="th"] .stab th{font-size:9px;letter-spacing:0}
html[lang="th"] .wx{font-size:11px}
body{font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;
  padding:0 0 50px;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:0 12px}

header{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:7px 0 0}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 12px 2px;
  max-width:560px;margin:0 auto}
.logo{font-size:15px;font-weight:750;letter-spacing:-.3px;white-space:nowrap;flex:0 0 auto;
  display:flex;align-items:baseline;gap:6px}
.logo{position:relative}
.logo .reg{font:inherit;font-size:11px;font-weight:650;color:var(--acc);letter-spacing:0;background:none;border:0;
  padding:4px 2px;cursor:pointer}
.regmenu{position:absolute;top:100%;left:40px;z-index:60;background:var(--card);border:1px solid var(--line);
  border-radius:10px;box-shadow:0 6px 24px rgba(15,27,45,.14);padding:4px;min-width:130px}
.regmenu a{display:block;padding:9px 12px;border-radius:7px;font-size:13px;font-weight:600;color:var(--tx);text-decoration:none}
.regmenu a.on{background:color-mix(in srgb,var(--acc) 12%,transparent);color:var(--acc)}
.hr2{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.upd{font-size:10px;color:var(--dim2);font-variant-numeric:tabular-nums;white-space:nowrap;
  display:flex;align-items:center;gap:3px}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--card)}
.lang button{font:inherit;font-size:11px;font-weight:700;letter-spacing:.2px;padding:8px 9px;
  border:0;background:none;color:var(--dim);cursor:pointer;line-height:1}
.lang button+button{border-left:1px solid var(--line)}
.lang button.on{background:var(--acc);color:#fff}
.tgl{background:none;border:1px solid var(--line);color:var(--dim);border-radius:8px;
  width:34px;height:34px;font-size:14px;cursor:pointer;line-height:1;padding:0}
/* Top bar. */
.wxbar{padding:3px 12px 1px;font-variant-numeric:tabular-nums;max-width:560px;margin:0 auto;
  display:grid;grid-template-columns:1fr auto 1fr;gap:1px 10px;align-items:baseline}
.wxbar>:nth-child(3n+1){justify-self:start}
.wxbar>:nth-child(3n+2){justify-self:start}
.wxbar>:nth-child(3n){justify-self:end}

.wx{display:inline-flex;align-items:baseline;gap:4px;font-size:11.5px;color:var(--dim);
  white-space:nowrap;text-align:center}
.wx b{color:var(--tx);font-weight:650}
.wx .mut{color:var(--dim2);font-size:10.5px}
.wx .ico{font-size:12.5px;font-style:normal;line-height:1}
@media (max-width:359px){.wx{font-size:10.5px;padding:0 5px}}
.tabs{display:flex;margin-top:5px;padding:0 12px;max-width:560px;margin-left:auto;margin-right:auto}
.tab{flex:1;padding:7px 4px;text-align:center;font-size:13px;font-weight:600;color:var(--dim);
  background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;font-family:inherit}
.tab.on{color:var(--tx);border-bottom-color:var(--acc)}

/* Summary block. */
.sum{margin:11px 0 4px;border-radius:14px;background:var(--card);border:1px solid var(--line);
  overflow:hidden;box-shadow:var(--shadow)}
.sumtop{padding:11px 13px;border-bottom:1px solid var(--line)}
.vhead{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.vscore{flex:0 0 auto;min-width:30px;height:30px;border-radius:9px;display:inline-flex;
  align-items:center;justify-content:center;font-weight:800;font-size:15px}
.gsub{font-size:12.5px;color:var(--tx);line-height:1.3;margin:5px 0 2px}
.gwhen{font-size:10.5px;color:var(--dim2);margin-left:auto;white-space:nowrap}
.danger{margin:0;padding:9px 13px;font-size:12.5px;font-weight:600;
  background:color-mix(in srgb,var(--bad) 12%,var(--card));color:var(--bad);
  border-top:1px solid color-mix(in srgb,var(--bad) 30%,transparent)}
.vbig{font-size:19px;font-weight:800;letter-spacing:-.4px;line-height:1.1;white-space:nowrap}
@media (max-width:360px){.vbig{font-size:17px}}
.vtx{font-size:12px;color:var(--dim);line-height:1.4}
.vtx b{color:var(--tx);font-weight:650}
.srow{display:flex;align-items:center;gap:8px;padding:7px 13px;border-bottom:1px solid var(--line);
  cursor:pointer;font-variant-numeric:tabular-nums}
.srow.nolink{cursor:default}
.rowx{border-bottom:1px solid var(--line)}
.rowx:last-child{border-bottom:0}
.rowx summary{list-style:none}
.rowx summary::-webkit-details-marker{display:none}
.rowx .srow{border-bottom:0}
.rowx[open] .srow{background:var(--card2)}
.rowx[open] .chev{transform:rotate(90deg)}
.rowx .chev{transition:transform .2s;font-size:13px;color:var(--dim2);flex:0 0 auto;margin-left:2px}
.rowbody{border-top:1px solid var(--line);background:var(--card2)}
.exact{margin:0;padding:8px 12px 0;font-size:12.5px;color:var(--dim)}
.rowbody .beach{margin:0;padding:8px 12px 0;font-size:12.5px;color:var(--dim)}
.rowbody .beach b{color:var(--tx)}
.rowbody .grid,.rowbody .tim,.rowbody .why,.rowbody .srcbox,.rowbody .nocam{background:var(--card)}
.rowmap{display:none}
.srow .map{margin-left:4px}
/* На узком экране цифры важнее времени пика: пик прячем, чтобы
   волна/период/ветер помещались рядом с пином. */
@media (max-width:430px){
  .srow .speak{display:none}
  .sname{flex:0 0 66px;font-size:13px}
  .sdat{font-size:11.5px}
}
.srow:last-child{border-bottom:0}
.sbadge{flex:0 0 30px;height:30px;border-radius:9px;display:flex;align-items:center;
  justify-content:center;font-weight:800;font-size:14px}
.sname{flex:0 0 72px;font-size:13.5px;font-weight:650;letter-spacing:-.2px}
.sdat{flex:1;font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.speak{flex:0 0 auto;font-size:10px;color:var(--dim2);text-align:right;
  display:flex;align-items:baseline;gap:4px;white-space:nowrap}
.speak b{color:var(--tx);font-size:12.5px;font-weight:700}

.card{margin:10px 0;border-radius:14px;background:var(--card);border:1px solid var(--line);
  overflow:hidden;box-shadow:var(--shadow);scroll-margin-top:calc(var(--stickH,150px) + 6px)}
.chead{display:flex;align-items:center;gap:10px;padding:10px 13px;cursor:pointer}
.chead .map{align-self:center}
.score{flex:0 0 38px;height:38px;border-radius:10px;display:flex;align-items:center;
  justify-content:center;font-weight:800;line-height:1}
.score b{font-size:17px;letter-spacing:-.5px}
.score i{display:none}
.cname{flex:1;min-width:0}
.cname h3{margin:0;font-size:15px;font-weight:700;letter-spacing:-.2px;line-height:1.2}
.map{position:relative;display:inline-flex;align-items:center;justify-content:center;
  width:22px;height:22px;border-radius:6px;border:1px solid var(--line);background:var(--card2);
  text-decoration:none;line-height:1;flex:0 0 auto}
.map::after{content:'';position:absolute;inset:-11px}
.map:hover{border-color:var(--acc)}
.map svg{display:block}
.cname p{margin:3px 0 0;font-size:12px;color:var(--dim);line-height:1.25;
  display:grid;grid-template-columns:auto auto;justify-content:start;gap:2px 18px}
.cname p b{color:var(--tx);font-weight:650}
.q{display:flex;align-items:baseline;gap:4px;min-width:0;white-space:nowrap}
.q i{font-style:normal;font-size:9.5px;color:var(--dim2);text-transform:uppercase;
  letter-spacing:.3px;flex:0 0 auto}
.q b{font-variant-numeric:tabular-nums}
.chev{color:var(--dim2);font-size:13px;transition:transform .2s}
.card.open .chev{transform:rotate(90deg)}
.cbody{display:none;border-top:1px solid var(--line)}
.card.open .cbody,.card.pin .cbody{display:block}

.cam{position:relative;background:#000;aspect-ratio:16/9;width:100%}
.cam iframe{width:100%;height:100%;border:0;display:block}
.cam img{width:100%;height:100%;object-fit:cover;display:block}
.camtag{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.62);backdrop-filter:blur(4px);
  font-size:10px;padding:3px 7px;border-radius:6px;color:#fff;display:flex;align-items:center;
  gap:5px;pointer-events:none;z-index:2}
.dot{width:6px;height:6px;border-radius:50%;background:#ff4444;animation:pulse 1.8s infinite}
@keyframes pulse{50%{opacity:.25}}
.nocam{display:flex;align-items:center;gap:7px;background:var(--card2);color:var(--dim2);
  font-size:11.5px;padding:8px 13px;border-bottom:1px solid var(--line)}
.nocam b{color:var(--dim);font-size:12px;font-weight:650}

.mets{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line)}
.met{background:var(--card);padding:8px 4px;text-align:center}
.met span{display:block;font-size:9px;color:var(--dim2);text-transform:uppercase;letter-spacing:.5px}
.met b{display:block;font-size:15px;font-weight:750;margin-top:2px;font-variant-numeric:tabular-nums}
.met i{font-style:normal;font-size:10px;color:var(--dim);font-weight:400}

.tim{border-top:1px solid var(--line);padding:8px 13px 9px}
.trow{display:flex;align-items:baseline;gap:9px;font-size:12.5px;padding:2.5px 0}
.trow>span{flex:0 0 46px;font-size:10px;color:var(--dim2);text-transform:uppercase;letter-spacing:.6px}
.trow>div{flex:1;color:var(--dim);font-variant-numeric:tabular-nums}
.trow b{color:var(--tx);font-weight:700}
.trow i{font-style:normal;font-size:10px;color:var(--dim2);margin-left:6px}
.tides{display:flex;gap:14px;flex-wrap:wrap}
.td{display:inline-flex;flex-direction:column;line-height:1.15}
.td em{font-style:normal;font-size:9.5px;color:var(--dim2);text-transform:uppercase;letter-spacing:.3px}
.td b{font-size:12.5px}
.why{padding:9px 13px;font-size:12.5px;color:var(--dim);line-height:1.5;border-top:1px solid var(--line)}
.why b{color:var(--tx);font-weight:650}
.conf{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:2px 7px;border-radius:5px;
  background:var(--card2);border:1px solid var(--line);margin-top:6px}

/* Per-source table. */
.srcbox{border-top:1px solid var(--line);font-size:12px}
.srcbox summary{padding:9px 13px;color:var(--acc);cursor:pointer;font-size:12px;
  font-weight:600;list-style:none}
.srcbox summary::-webkit-details-marker{display:none}
.srcbox summary::before{content:'▸ ';display:inline-block;transition:transform .2s}
.srcbox[open] summary::before{content:'▾ '}
.stab{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;margin-bottom:2px}
.stab th{font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim2);
  font-weight:600;text-align:right;padding:5px 13px 4px}
.stab th:first-child{text-align:left}
.stab td{padding:4px 13px;text-align:right;color:var(--dim);border-top:1px solid var(--line)}
.stab td:first-child{text-align:left;color:var(--tx);font-size:11.5px}
.stab .avgrow td{font-weight:700;color:var(--tx);background:var(--card2)}
.snote{padding:7px 13px 10px;font-size:11.5px;color:var(--dim);line-height:1.5}
.snote b{color:var(--dim)}
.stab .rngrow td{color:var(--dim2);font-size:11px;border-top:0;padding-top:0}
.stab .xrow td{color:var(--dim);border-top:1px dashed var(--line)}
.spl{display:block;white-space:nowrap;line-height:1.5}
.stab .xrow td:first-child{color:var(--tx)}
.stat{border-top:1px solid var(--line);padding:8px 13px 10px}
.stline{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--dim);padding:2.5px 0}
.stline b{margin-left:auto;font-weight:600;font-size:11px}
.sdot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.pill{display:inline-block;font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:5px;
  letter-spacing:.2px;vertical-align:middle;margin-right:4px}
.pill.ok{background:color-mix(in srgb,var(--go) 15%,transparent);color:var(--go)}
.pill.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
/* Hourly grid: fixed row labels, scrollable data. */
.grid{display:flex;border-top:1px solid var(--line);padding:9px 0 4px}
.glab{flex:0 0 52px;padding-left:13px;background:var(--card);z-index:2}
.glab div{font-size:9.5px;color:var(--dim2);text-transform:uppercase;letter-spacing:.4px;
  height:20px;display:flex;align-items:center;white-space:nowrap}
.glab div:nth-child(2){height:36px}
.gscroll{flex:1;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.gscroll::-webkit-scrollbar{display:none}
.grow{display:flex}
.hc{flex:0 0 38px;height:20px;display:flex;align-items:center;justify-content:center;
  font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;position:relative}
.gbar .hc{height:36px;align-items:flex-end;padding-bottom:2px}
.gbar .hc i{display:block;width:17px;border-radius:3px 3px 0 0;font-style:normal}
.hc.gh{font-size:10.5px;color:var(--dim2)}
.hc.best.gh{color:var(--go);font-weight:800}
.hc.gv{color:var(--tx);font-weight:600}
.hc.gw{color:var(--dim);font-weight:400}
.hc.grain{color:var(--acc);font-weight:600;font-size:10px}
.hc.now{background:color-mix(in srgb,var(--acc) 13%,transparent)}
.hc.now.gh{color:var(--acc);font-weight:700}

.glegend{padding:2px 13px 10px;font-size:11.5px;color:var(--dim);line-height:1.45}
/* Details disclosure. */
.more{border-top:1px solid var(--line)}
/* direct child only: a folded list may hold rows that are details themselves */
.more > summary{padding:9px 13px;color:var(--acc);cursor:pointer;font-size:12.5px;
  font-weight:600;list-style:none}
.more > summary::-webkit-details-marker{display:none}
.more > summary::before{content:'▸ '}
.more[open] > summary::before{content:'▾ '}
.more .srcbox,.more .why,.more .grid{border-top:1px solid var(--line)}

.days{border-top:1px solid var(--line)}
.day{display:flex;align-items:center;gap:9px;padding:8px 13px;border-bottom:1px solid var(--line);font-size:12.5px}
.day:last-child{border-bottom:0}
.dayx summary{list-style:none;cursor:pointer}
.dayx summary::-webkit-details-marker{display:none}
.dayx[open] summary{background:var(--card2)}
.daybody{border-bottom:1px solid var(--line);background:var(--card2)}
.daybody .grid,.daybody .tim,.daybody .why,.daybody .srcbox{background:var(--card)}
.day .dn{flex:0 0 54px;color:var(--dim);font-size:11.5px}
.day .dn b{display:block;color:var(--tx);font-size:12.5px;font-weight:650;text-transform:capitalize}
.dbar{flex:1;height:22px;border-radius:6px;position:relative;overflow:hidden}
.dbar i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;font-style:normal;opacity:.42}
/* Полоса залита светлым оттенком своего цвета по всей длине, заполнение
   поверх приглушено. Текст поэтому везде лежит на светлом и читается
   без обводки, где бы ни кончалась цветная часть. */
.dbar em{position:absolute;left:8px;top:0;bottom:0;display:flex;align-items:center;font-style:normal;
  font-size:11px;font-weight:650;color:var(--tx);font-variant-numeric:tabular-nums}
.dsc{flex:0 0 26px;text-align:right;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}

.ihead{padding:11px 13px 8px;font-size:11px;font-weight:700;color:var(--dim2);
  text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid var(--line)}
.ev{display:flex;align-items:center;gap:9px;padding:8px 13px;border-bottom:1px solid var(--line)}
.evd{flex:0 0 78px;font-size:12.5px;font-weight:650;text-transform:capitalize}
.evb{flex:1;height:16px;border-radius:5px;background:var(--card2);overflow:hidden}
.evb i{display:block;height:100%;border-radius:5px}
.evv{flex:0 0 auto;text-align:right;font-variant-numeric:tabular-nums}
.evv b{font-size:13px}
.evv span{display:block;font-size:10px;color:var(--dim2)}
.ocn{display:flex;gap:10px;padding:9px 13px;border-bottom:1px solid var(--line)}
.ocname{flex:0 0 96px;font-size:12px;font-weight:650;line-height:1.25}
.ocname i{display:block;font-style:normal;font-size:10px;color:var(--dim2);font-weight:400}
.ocbody{flex:1;font-size:12px;color:var(--dim);line-height:1.45;font-variant-numeric:tabular-nums}
.ocbody b{color:var(--tx);font-weight:650}
.ocsub{font-size:11.5px;color:var(--dim2)}
.inote{padding:11px 13px;font-size:12.5px;color:var(--dim);line-height:1.55}
.inote2{padding:8px 13px 11px;font-size:11.5px;color:var(--dim);line-height:1.5}
.chips{display:flex;gap:6px;overflow-x:auto;padding:9px 2px;scrollbar-width:none;
  -webkit-overflow-scrolling:touch;position:sticky;top:var(--headH,110px);z-index:20;
  background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(10px);

  let s=0,c=0; a.forEach(d=>{const r=d*Math.PI/180; s+=Math.sin(r); c+=Math.cos(r)});

/* ===== TUNE: everything that decides "good waves" lives here. =====

   weights  : share of each factor in the score, should add up to 1.
   size     : below swellMin the size factor is 0..belowMax, at the
              optimum (opt, 0..1 inside the spot range) it is 10.
   swellPeriod: long swell breaks bigger and wraps headlands better, so the
              height is scaled by (period/ref)^power, never below floor.

const TUNE={

    {min:6, key:'gGood', color:'var(--ok)'},
    {min:5, key:'gFair', color:'var(--fair)'},
    {min:3, key:'gWeak', color:'var(--mid)'},
    {min:2, key:'gPoor', color:'var(--bad)'},

  size:{opt:0.45, belowMax:2, atMin:2, overMax:4, overFade:1.2},
  period:{from:3.5, span:8},

     это двойка, десятка только около оптимума. */
  let size;
  if(eff<sp.swellMin) size=clamp(eff/sp.swellMin,0,1)*Z.belowMax;
  else if(eff>sp.swellMax) size=clamp(1-(eff-sp.swellMax)/Z.overFade,0,1)*Z.overMax;
  else{
    const rel=(eff-sp.swellMin)/(sp.swellMax-sp.swellMin);
    size = rel<=Z.opt ? Z.atMin+(10-Z.atMin)*(rel/Z.opt) : 10-(10-Z.overMax)*((rel-Z.opt)/(1-Z.opt));
  }
  const period=per==null?5:clamp((per-TUNE.period.from)/TUNE.period.span,0,1)*10;
  const dirS=clamp(1-(sdir==null?45:angDiff(sdir,sp.facing))/95,0,1)*10;
  const wOff=angDiff(wdir==null?sp.facing:wdir,(sp.facing+180)%360);
  let wind;
  // unknown wind is neutral; only a real calm earns the calm bonus
  if(wsp==null) wind=5;
  else if(wsp<1.2) wind=8.5;
  else if(wOff<55) wind=clamp(10-(wsp-3)*0.35,5,10);
  else if(wOff<115) wind=clamp(7.5-wsp*0.55,1.5,7.5);
  else wind=clamp(7-wsp*1.15,0,7);
  let tideAdj=0;
  if(tide!=null){
    if(sp.tide==='high') tideAdj=(tide-0.55)*1.7;
    else if(sp.tide==='low') tideAdj=(0.55-tide)*1.7;
    else if(sp.tide==='mid') tideAdj=(0.5-Math.abs(tide-0.55))*1.6;
  }
  const raw=size*W.size+period*W.period+dirS*W.dir+wind*W.wind+tideAdj;
  /* Размер работает и как потолок. Без волны хороший ветер и удачное
     направление не должны давать четвёрку: кататься всё равно не на чем. */
  const cap = eff>=sp.swellMin ? 10 : clamp(eff/sp.swellMin,0,1)*TUNE.cap.slope+TUNE.cap.base;
  return clamp(Math.min(raw,cap),0,10);
}

/* One request covers all spots; spots sharing a grid point share a column. */
function pointsOf(spots, span){
  const pts=[...new Set(spots.map(s=>s.lat.toFixed(2)+','+s.lon.toFixed(2)))];
  return {pts, base:'latitude='+pts.map(p=>p.split(',')[0]).join(',')+
    '&longitude='+pts.map(p=>p.split(',')[1]).join(',')+'&timezone=Asia%2FBangkok'+span};
}

/* MET Norway timeseries indexed by local hour. */
function metIndex(mn){
  const MET={};
  if(mn) for(const p of mn.properties.timeseries){
    const k=new Date(p.time).toLocaleString('sv-SE',{timeZone:'Asia/Bangkok'}).slice(0,13).replace(' ','T');
    const d=p.data.instant.details;
    MET[k]={s:d.wind_speed, d:d.wind_from_direction};
  }
  return MET;
}

/* Model medians per spot and hour, then the score. core = {m,w,tSea} as

function buildSpots(spots, pts, core, MET, ww3, waveModels){
  const WM=waveModels||WAVE_MODELS;
  const {m,w,tSea}=core;
  // wind or sea may be missing when a source is down; waves are required
  const M=[].concat(m), W=w?[].concat(w):[], T=tSea?[].concat(tSea):null;
  MET=MET||{};
  const idx={}; pts.forEach((p,i)=>idx[p]=i);
  const out={};
  for(const sp of spots){
    const i=idx[sp.lat.toFixed(2)+','+sp.lon.toFixed(2)];
    if(i==null||!M[i]||!M[i].hourly) continue;   // no data for this spot: leave it out
    const mh=M[i].hourly, wh=W[i]?.hourly||{}, th=T&&T[i]?T[i].hourly:{}, rows=[];
    for(let k=0;k<mh.time.length;k++){
      const time=mh.time[k], hourKey=time.slice(0,13);
      const met=MET[hourKey]||null;

      const sRaw=WM.map(md=>({m:md,
        h:mh['wave_height_'+md]?.[k], p:mh['wave_period_'+md]?.[k],
        d:mh['wave_direction_'+md]?.[k],
        sw:mh['swell_wave_height_'+md]?.[k], swp:mh['swell_wave_period_'+md]?.[k]}));
      const sH=sRaw.map(x=>x.h);

      const wRaw=WIND_MODELS.map(md=>({m:md,
        s:wh['wind_speed_10m_'+md]?.[k], d:wh['wind_direction_10m_'+md]?.[k],
        g:wh['wind_gusts_10m_'+md]?.[k]}));
      if(met) wRaw.push({m:'metno', s:met.s, d:met.d, g:null});
      const wS=wRaw.map(x=>x.s);
      const w3=ww3?ww3[hourKey]:null;

      rows.push({t:time,
        swell:median(sH), period:median(sRaw.map(x=>x.p)),
        sdir:circMean(sRaw.map(x=>x.d)),
        swellOnly:median(sRaw.map(x=>x.sw)),
        swellRange:range(sH), windRange:range(wS),
        sst:th.sea_surface_temperature?.[k],
        tideRaw:th.sea_level_height_msl?.[k],
        windWave:median(WM.map(md=>mh['wind_wave_height_'+md]?.[k])),
        rain:median(WIND_MODELS.map(md=>wh['precipitation_'+md]?.[k])),
        wind:median(wS), wdir:circMean(wRaw.map(x=>x.d)),
        gust:median(wRaw.map(x=>x.g)),
        // raw per-model values
        ww3:w3,
        raw:{wave:sRaw, wind:wRaw}});
    }
    const tv=rows.map(r=>r.tideRaw).filter(x=>x!=null);
    const tmin=tv.length?Math.min(...tv):0, tmax=tv.length?Math.max(...tv):0;
    rows.forEach(r=>{r.tide=r.tideRaw==null?null:(tmax>tmin?(r.tideRaw-tmin)/(tmax-tmin):0.5);
      r.score=scoreHour(sp,r)});
    out[sp.id]=rows;
  }
  return out;
}

/* Local extrema. Data is hourly, so the peak is refined with a
   three-point parabola, otherwise tides always land on :00.       */
function extrema(rows,key,from,to){
  const out=[];
  for(let i=Math.max(from,1);i<Math.min(to,rows.length-1);i++){
    const a=rows[i-1][key], b=rows[i][key], c=rows[i+1][key];
    if(a==null||b==null||c==null) continue;
    const hi=b>=a&&b>c, lo=b<=a&&b<c;
    if(!hi&&!lo) continue;
    const den=a-2*b+c, shift=den===0?0:clamp(0.5*(a-c)/den,-.5,.5);
    const d=new Date(rows[i].t+':00'); d.setMinutes(d.getMinutes()+Math.round(shift*60));
    out.push({type:hi?'high':'low', v:b, idx:i,
      hhmm:String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')});
  }
  return out;
}


async function jget(u,opt,ms=10000){

    if(!r.ok) throw new Error('HTTP '+r.status);

  } finally{ clearTimeout(timer) }
}
/* Open-Meteo's main forecast host went down on 19 Sep 2026 while marine kept
   working. previous-runs-api serves the same models in the same format (latest
   run by default). Asking both every time doubled the calls against the daily
   limit, so the spare is asked when the main host fails or stays silent for
   OM_HEDGE, and first for OM_MEMO after a failure, on later page loads too. */
const OM_MAIN='https://api.open-meteo.com/', OM_SPARE='https://previous-runs-api.open-meteo.com/';
const OM_HEDGE=2500, OM_MEMO=10*60*1000;
let OM_DOWN=+LS.get('om_down')||0;
function jgetOM(u,ms){
  const main=()=>jget(u,undefined,ms), spare=()=>jget(u.replace(OM_MAIN,OM_SPARE),undefined,ms);
  if(Date.now()-OM_DOWN<OM_MEMO) return spare().catch(main);
  return new Promise((res,rej)=>{
    let left=1, asked=false;
    const fail=e=>{ if(--left===0) rej(e); };
    const hedge=()=>{ if(asked) return; asked=true; left++; spare().then(res,fail); };
    const timer=setTimeout(hedge,OM_HEDGE);
    main().then(v=>{ clearTimeout(timer); res(v); },
      e=>{ clearTimeout(timer); OM_DOWN=Date.now(); LS.set('om_down',String(OM_DOWN)); hedge(); fail(e); });
  });
}

/* NOAA WaveWatch III via PacIOOS ERDDAP. Independent of Open-Meteo,
   no key. Publishes total wave for 6 days but the swell component only
   for 8 hours, so it is shown for comparison and kept out of the median.
   0.5° grid, so the whole island falls into one node, one request.    */
async function loadWW3(){
  const pad=n=>String(n).padStart(2,'0');
  const iso=d=>`${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}T${pad(d.getUTCHours())}:00:00Z`;
  const t0=iso(new Date()), t1=iso(new Date(Date.now()+6*864e5));
  const P=REG().ww3;
  const idx=`%5B(${t0}):1:(${t1})%5D%5B(0.0)%5D%5B(${P.lat})%5D%5B(${P.lon})%5D`;
  const url='https://pae-paha.pacioos.hawaii.edu/erddap/griddap/ww3_global.json?'+
    ['Thgt','Tper','Tdir'].map(v=>v+idx).join(',');
  const j=await jget(url);
  const cols=j.table.columnNames, out={};
  const ci=n=>cols.indexOf(n);
  for(const r of j.table.rows){
    // ERDDAP returns UTC
    const k=new Date(r[ci('time')]).toLocaleString('sv-SE',{timeZone:'Asia/Bangkok'})
      .slice(0,13).replace(' ','T');
    const h=r[ci('Thgt')];
    out[k]={h:h==null?null:h*P.k, p:r[ci('Tper')], d:r[ci('Tdir')]};
  }
  return out;
}

/* Two-stage fetch. Core sources (wave, wind, sea) are enough to score
   every beach, so the page renders as soon as they arrive. Extras
   (weather bar, MET Norway, WW3, ocean points) fill in afterwards: WW3

const spotPoints=(days=10)=>pointsOf(SPOTS,'&forecast_days='+days);
/* Beaches that share a model grid cell (grid.js, built by tools/grid.mjs) are
   asked as one point: Open-Meteo counts every point as a call, and 13 points
   around Phuket are 3 to 6 cells. q is the query for the short list, expand
   turns its answer back into one entry per beach point, same numbers as a
   full request. src: a wave model, 'wind' or 'sea'. */
function gridPoints(src,days){
  const {pts}=spotPoints(days), map=(typeof GRID!=='undefined'&&GRID[src])||{};
  const rep=p=>map[p]||p, uniq=[...new Set(pts.map(rep))];
  return {q:'latitude='+uniq.map(p=>p.split(',')[0]).join(',')+'&longitude='+uniq.map(p=>p.split(',')[1]).join(',')+
      '&timezone=Asia%2FBangkok&forecast_days='+days,

   first screen only needs now and the next daylight window, so a 2-day
   request goes first and the full 10 days replaces it when it arrives. */
/* One request per wave model instead of one for all four: a slow or failed
   model no longer takes the others down with it. Any model that answers is
   enough to score; the median simply uses fewer models. Single-model answers
   come without the _model suffix, so it is added back here. */
async function wavesByModel(days){
  const url=q=>'https://marine-api.open-meteo.com/v1/marine?'+q+
    '&hourly=wave_height,wave_period,wave_direction,swell_wave_height,swell_wave_period,wind_wave_height&models=';
  // wait for all models, but no longer than 4 s after the first one arrived
  const ok=await new Promise(res=>{
    const got=[]; let left=WAVE_MODELS.length, timer=null;
    const done=()=>{ clearTimeout(timer); res(got.slice()); };
    WAVE_MODELS.forEach(md=>{ const g=gridPoints(md,days); jget(url(g.q)+md,undefined,20000).then(j=>{
        got.push([md,g.expand(j)]);
        if(!timer) timer=setTimeout(done,4000);
      }).catch(()=>{}).finally(()=>{ if(--left===0) done(); }); });
  });
  if(!ok.length) throw new Error(t('noData').trim()||'no waves');
  const n=ok[0][1].length, out=[];
  for(let i=0;i<n;i++){
    const hourly={time:ok[0][1][i].hourly.time};
    for(const [md,locs] of ok) for(const [k,v] of Object.entries(locs[i].hourly))
      if(k!=='time') hourly[k+'_'+md]=v;
    out.push({hourly});
  }

}
/* WW3 series shaped like an Open-Meteo marine answer: one location per spot
   point, hourly from 00:00 today so it lines up with the wind grid. */
function ww3AsMarine(ww,days){
  const today=new Date().toLocaleString('sv-SE',{timeZone:'Asia/Bangkok'}).slice(0,10);
  const time=[], h=[], p=[], d=[];
  for(let i=0;i<days*24;i++){
    const dt=new Date(today+'T00:00:00Z'); dt.setUTCHours(i);
    const k=dt.toISOString().slice(0,13), v=ww[k];
    time.push(k+':00'); h.push(v?v.h:null); p.push(v?v.p:null); d.push(v?v.d:null);
  }
  const hourly={time,wave_height_ww3:h,wave_period_ww3:p,wave_direction_ww3:d};
  return spotPoints(days).pts.map(()=>({hourly}));
}

  const sh=spare.m[0].hourly, at={}; sh.time.forEach((t,i)=>at[t]=i);
  const m=om.m.map(loc=>{
    const h={...loc.hourly}, pick=k=>h.time.map(t=>at[t]==null?null:sh[k][at[t]]);
    h.wave_height_ww3=pick('wave_height_ww3'); h.wave_period_ww3=pick('wave_period_ww3');
    h.wave_direction_ww3=pick('wave_direction_ww3');
    return {hourly:h};
  });
  return {...om, m, met:om.met||spare.met, waveModels:WAVE_MODELS.concat('ww3')};
}

function hourStrip(rows,i0){

  const best=d.length?Math.max(...d.map(r=>r.score??0)):-1;
  const cells=slice.map(r=>{
    const s=r.score??0, night=!isDay(r), h=Math.max(3,Math.round(s/10*30));
    const isNow=rows.indexOf(r)===i0;
    return {hh:r.t.slice(11,13), s, night, h, isNow, rain:r.rain,
      top:(!night&&s===best&&s>5), sw:fmt(r.swell,1), wd:fmt(r.wind,0)};
  });
  // rain row only when rain is expected
  const wet=cells.some(c=>(c.rain??0)>=0.1);
  const row=(cls,fn)=>cells.map(c=>`<div class="hc ${c.isNow?'now':''} ${c.top?'best':''} ${cls}"
    style="${c.night?'opacity:.35':''}">${fn(c)}</div>`).join('');
  return `<div class="grid">
    <div class="glab"><div>${t('hHour')}</div><div>${t('hScore')}</div><div>${t('hWave')}</div><div>${t('hWind')}</div>${

        `${c.hh}`)}</div>

        `<i style="height:${c.h}px;background:${c.night?'var(--no)':scoreColor(c.s)}"></i>`)}</div>
      <div class="grow">${row('gv',c=>c.sw)}</div>

}

/* Peaks, tides and current trend. */
function peaksOf(rows,i0){
  return extrema(rows,'score',i0,Math.min(rows.length,i0+30))
    .filter(e=>e.type==='high'&&isDay(rows[e.idx])&&(rows[e.idx].score??0)>1.5).slice(0,3);
}
function timing(sp,rows,i0){
  const today=rows[i0].t.slice(0,10);
  const peaks=peaksOf(rows,i0).slice(0,2);
  const tides=extrema(rows,'tideRaw',i0,Math.min(rows.length,i0+30)).slice(0,3);
  const cur=rows[i0].score??0,
        nxt=rows[Math.min(i0+2,rows.length-1)].score??0,
        prv=rows[Math.max(i0-2,0)].score??0;
  let phase,pcol;
  if(!isDay(rows[i0])){phase=peaks[0]?t('darkUntil',peaks[0].hhmm):t('dark');pcol='var(--dim)'}
  else if(cur>=prv&&cur>=nxt){phase=t('atPeak');pcol='var(--go)'}
  else if(nxt>cur+0.25){phase=t('rising');pcol='var(--ok)'}
  else if(nxt<cur-0.25){phase=t('falling');pcol='var(--bad)'}
  else{phase=t('flat');pcol='var(--dim)'}
  // день пишем один раз, а не перед каждым пиком
  let lastDay='';
  const pk=peaks.length?peaks.map(p=>{
      const day=rows[p.idx].t.slice(0,10);
      const pre=(day===today||day===lastDay)?'':t('tomorrow')+' ';
      lastDay=day;
      return `${pre}<b>${p.hhmm}</b> <span style="color:${scoreColor(p.v)}">${shown(p.v)}</span>`;
    }).join(' · '):`<span style="color:var(--dim2)">${t('noPeak')}</span>`;
  return `<div class="tim">
    <div class="trow"><span>${t('tPeak')}</span><div>${pk}</div></div>
    <div class="trow"><span>${t('tTide')}</span><div class="tides">${
      tides.slice(0,3).map(td=>`<span class="td"><em>${
        td.type==='high'?t('tideHigh'):t('tideLow')}</em><b>${td.hhmm}</b></span>`).join('')||'–'}
      </div></div>
    <div class="trow"><span>${t('tNow')}</span><div style="color:${pcol};font-weight:650">${phase}</div></div>
  </div>`;
}

function why(sp,r){
  const b=[], eff=r.swell==null?null:r.swell*(1-sp.shelter*0.55);
  if(eff!=null) b.push(eff<sp.swellMin?t('swellShort',fmt(eff,2),sp.swellMin)
    :eff>sp.swellMax?t('swellOver',fmt(eff,1))
    :t('swellOk',fmt(eff,1)));
  if(r.period!=null) b.push(r.period<6?t('perShort',fmt(r.period,1))
    :r.period<9?t('perMid',fmt(r.period,1)):t('perLong',fmt(r.period,1)));
  if(r.wdir!=null&&r.wind!=null){
    const off=angDiff(r.wdir,(sp.facing+180)%360);
    b.push(off<55?t('windOff',dirRu(r.wdir),fmt(r.wind,0))
      :off<115?t('windSide',dirRu(r.wdir),fmt(r.wind,0))
      :t('windOn',dirRu(r.wdir),fmt(r.wind,0)));
  }
  // How far the sources disagree, in plain words
  const sr=r.swellRange, wr=r.windRange;
  const mult=x=>x&&x.lo>0.05?x.hi/x.lo:null;
  const ms=mult(sr), mw=mult(wr);
  const worst=Math.max(ms||1,mw||1);
  let conf;
  if(worst>=2.5) conf=['var(--bad)',t('agreeBad',worst.toFixed(1))];
  else if(worst>=1.6) conf=['var(--mid)',t('agreeMid',worst.toFixed(1))];
  else conf=['var(--go)',t('agreeOk')];
  const detail=(sr&&wr)?t('bySource',fmt(sr.lo,2),fmt(sr.hi,2),fmt(wr.lo,1),fmt(wr.hi,1)):'';
  // share of local wind chop
  if(r.windWave!=null && r.swell!=null && r.windWave>0.05 && r.windWave>=r.swell*0.35)
    b.push(t('chop',fmt(r.windWave,2)));
  return `<div class="why">${b.join(' · ')}<br>
    <span class="conf" style="color:${conf[0]}">◆ ${conf[1]}</span>
    ${detail?`<div style="margin-top:5px;color:var(--dim2);font-size:11px">${detail}</div>`:''}
  </div>`;
}

function dayRows(sp,rows,n){
  const by={};
  rows.forEach(r=>{const d=r.t.slice(0,10);(by[d]=by[d]||[]).push(r)});
  return '<div class="days">'+Object.keys(by).slice(0,n).map(d=>{
    const rs=by[d].filter(isDay); if(!rs.length) return '';
    const sc=Math.max(...rs.map(r=>r.score??0));
    const bi=rs.reduce((a,b)=>(b.score??0)>(a.score??0)?b:a);
    const dt=new Date(d+'T12:00:00');
    const i0=rows.indexOf(rs[0]);
    // details are built on first open, not up front: 120 days of tables was ~34k nodes
    const detail=`<div class="daybody lz"></div>`;
    return `<details class="dayx lazy" data-k="day" data-s="${sp.id}" data-i0="${i0}" data-r="${rows.indexOf(bi)}"><summary class="day">
      <div class="dn"><b>${dt.toLocaleDateString(LOCALE[LANG],{weekday:'short'})}</b>${
        dt.toLocaleDateString(LOCALE[LANG],{day:'numeric',month:'short'})}</div>
      <div class="dbar" style="background:color-mix(in srgb,${scoreColor(sc)} 13%,var(--card))">
        <i style="width:${Math.max(6,sc*10)}%;background:${scoreColor(sc)}"></i>
        <em>${fmt(avg(rs.map(r=>r.swell)),1)} ${t('uM')} · ${fmt(avg(rs.map(r=>r.wind)),0)} ${t('uMs')} · ${t('peak')} ${bi.t.slice(11,16)}</em></div>
      <div class="dsc" style="color:${scoreColor(sc)}">${shown(sc)}</div>
      </summary>${detail}</details>`}).join('')+'</div>';
}

function card(sp,rows,pinned){
  const i0=nowIdx(rows);
  const dark=!isDay(rows[i0]);
  const r=(dark?bestDaylight(rows,i0,30):rows[i0])||rows[i0];
  const s=r.score??0;

  if(TAB==='now'){

      `<details class="more lazy" data-k="more" data-s="${sp.id}" data-i0="${i0}" data-r="${rows.indexOf(r)}"><summary>${t('more')}</summary>
         <div class="lz"></div>

/* Weather bar from MET Norway when Open-Meteo is down: temperature, sky, wind
   and rain; sunrise and sunset are computed, UV stays empty. */
const MET_SKY=[['thunder',95],['heavysnow',75],['snow',71],['sleet',66],['heavyrain',65],['lightrain',61],
  ['rain',63],['fog',45],['partlycloudy',2],['cloudy',3],['fair',1],['clearsky',0]];
function metWeather(mn){
  const p=mn&&mn.properties&&mn.properties.timeseries[0]; if(!p) return null;
  const d=p.data.instant.details, sym=(p.data.next_1_hours||p.data.next_6_hours||{}).summary?.symbol_code||'';
  const code=(MET_SKY.find(([k])=>sym.includes(k))||[,null])[1];
  return {src:'metno', current:{temperature_2m:d.air_temperature, apparent_temperature:null, weather_code:code,
    wind_speed_10m:d.wind_speed, wind_direction_10m:d.wind_from_direction, wind_gusts_10m:null,
    precipitation:p.data.next_1_hours?.details?.precipitation_amount??0}, daily:null};
}
/* Sunrise and sunset, NOAA's simplified formula; good to a couple of minutes. */
function sunTimes(lat,lon){
  const now=new Date(), J=Math.floor(now/864e5)+2440587.5-2451545+0.0008, rad=Math.PI/180;
  const n=Math.round(J-lon/360), M=(357.5291+0.98560028*(n-lon/360))%360;
  const C=1.9148*Math.sin(M*rad)+0.02*Math.sin(2*M*rad), L=(M+C+282.9372)%360;
  const T=2451545+n-lon/360+0.0053*Math.sin(M*rad)-0.0069*Math.sin(2*L*rad);
  const dec=Math.asin(Math.sin(L*rad)*Math.sin(23.44*rad));
  const w=Math.acos((Math.sin(-0.83*rad)-Math.sin(lat*rad)*Math.sin(dec))/(Math.cos(lat*rad)*Math.cos(dec)))/rad;
  const hm=jd=>new Date((jd-2440587.5)*864e5).toLocaleTimeString('en-GB',{timeZone:'Asia/Bangkok',hour:'2-digit',minute:'2-digit'});
  return [hm(T-w/360),hm(T+w/360)];
}

/* Which sources answered and which did not. */
function statusBlock(){
  const rows=Object.values(STATUS).map(s=>
    `<div class="stline"><span class="sdot" style="background:${
       s.ok?'var(--go)':s.optional?'var(--dim2)':'var(--bad)'}"></span>
     ${s.label}<b style="color:${s.ok?'var(--dim)':s.optional?'var(--dim2)':'var(--bad)'}">${
       s.ok?(s.note||'ok'):s.optional?s.err:t('noData')+s.err}</b></div>`).join('');

function statusPill(){
  if(STALE) return `<span class="pill bad">${t(STALE_REASON==='rateLimit'?'limited':'offline')}</span>`;
  const all=Object.values(STATUS).filter(s=>!(s.optional&&!s.ok));
  const bad=all.filter(s=>!s.ok);

    ? `<span class="pill bad" title="${bad.map(b=>b.label).join(', ')}">${t('srcSome',all.length-bad.length,all.length)}</span>`
    : `<span class="pill ok">${t('srcCount',all.length)}</span>`;
}

/* Every model separately, so the median can be checked by hand. */
function sources(r){
  if(!r.raw) return '';
  const NAME={gwam:'DWD GWAM',meteofrance_wave:'MeteoFrance WAM',
    ncep_gfswave016:'NOAA GFS-Wave',ecmwf_wam025:'ECMWF WAM',
    icon_seamless:'ICON (DWD)',gfs_seamless:'GFS (NOAA)',ecmwf_ifs025:'ECMWF IFS',
    meteofrance_seamless:'ARPEGE (MF)',jma_seamless:'JMA',metno:'MET Norway ⧉', ww3:'NOAA WW3 ⧉'};
  const wave=r.raw.wave.filter(x=>x.h!=null).map(x=>`<tr><td>${NAME[x.m]}</td>
      <td>${fmt(x.h,2)}</td><td>${fmt(x.p,1)}</td><td>${x.d==null?'–':Math.round(x.d)+'°'}</td></tr>`).join('');
  const totals=r.raw.wave.some(x=>x.m==='ww3')||!r.ww3?[]:[{n:NAME['ww3'],v:r.ww3.h}];
  // как каждая модель делит волну на свелл и ветровую: величины несравнимые
  const splits=r.raw.wave.filter(x=>x.sw!=null&&x.sw>0.01)
    .map(x=>`<span class="spl">${NAME[x.m]} <b>${fmt(x.sw,2)}</b> / ${fmt(x.swp,0)} ${t('uS')}</span>`);
  const wind=r.raw.wind.map(x=>`<tr><td>${NAME[x.m]}</td>
      <td>${fmt(x.s,1)}</td><td>${x.d==null?'–':dirRu(x.d)}</td><td>${fmt(x.g,1)}</td></tr>`).join('');
  return `<details class="srcbox"><summary>${t('showSources')}</summary>
    <table class="stab"><thead><tr><th>${t('wave')}</th><th>${t('colSwell')}</th><th>${t('colPeriod')}</th><th>${t('colDir')}</th></tr></thead>
      <tbody>${wave}
      <tr class="avgrow"><td>${t('median')}</td><td>${fmt(r.swell,2)}</td><td>${fmt(r.period,1)}</td>
        <td>${r.sdir==null?'–':Math.round(r.sdir)+'°'}</td></tr>
      ${r.swellRange?`<tr class="rngrow"><td>${t('spread')}</td>
        <td colspan="3">${fmt(r.swellRange.lo,2)}–${fmt(r.swellRange.hi,2)}</td></tr>`:''}
      ${totals.length?`<tr class="xrow"><td>${t('totalWave')}</td>
        <td colspan="3">${totals.map(x=>`${x.n} <b>${fmt(x.v,2)}</b>`).join(' · ')}</td></tr>`:''}
      ${splits.length?`<tr class="xrow"><td>${t('swellPart')}</td>
        <td colspan="3">${splits.join('')}</td></tr>
      <tr class="rngrow"><td></td><td colspan="3">${t('swellNote')}</td></tr>`:''}
      </tbody></table>
    <table class="stab"><thead><tr><th>${t('wind')}</th><th>${t('colSpeed')}</th><th>${t('colDir')}</th><th>${t('colGust')}</th></tr></thead>
      <tbody>${wind}
      <tr class="avgrow"><td>${t('median')}</td><td>${fmt(r.wind,1)}</td>
        <td>${r.wdir==null?'–':dirRu(r.wdir)}</td><td>${fmt(r.gust,1)}</td></tr>
      ${r.windRange?`<tr class="rngrow"><td>${t('spread')}</td>
        <td colspan="3">${fmt(r.windRange.lo,1)}–${fmt(r.windRange.hi,1)}</td></tr>`:''}
      </tbody></table>
    <div class="snote">${t('srcNote')}</div>
    ${statusBlock()}
  </details>`;
}

/* Island overview. Built only on measurable values: wave anomaly
   against its own 10-day median, and the ocean watchpoints.        */
function islandReport(){
  // reference beach for the region: first pinned one
  const ref=DATA[(SPOTS.find(x=>x.pin&&DATA[x.id])||SPOTS.find(x=>DATA[x.id])).id];
  const days={};
  ref.forEach(r=>{ if(isDay(r)&&r.swell!=null) (days[r.t.slice(0,10)]=days[r.t.slice(0,10)]||[]).push(r); });
  const keys=Object.keys(days).sort();
  const dayMax=keys.map(k=>({d:k, v:Math.max(...days[k].map(r=>r.swell)),
    sc:Math.max(...days[k].map(r=>r.score??0)),
    per:median(days[k].map(r=>r.period)), wind:median(days[k].map(r=>r.wind))}));
  const base=median(dayMax.map(x=>x.v));           // baseline for the period

  // days noticeably above the baseline
  const events=dayMax.filter(x=>x.v>=base*1.25&&x.v>=base+0.15);

  const fmtD=k=>{const dt=new Date(k+'T12:00:00');
    return dt.toLocaleDateString(LOCALE[LANG],{weekday:'short',day:'numeric',month:'short'})};

  let ev;
  if(!events.length){
    ev=`<div class="inote">${t('noEvents',fmt(base,1))}</div>`;
  }else{
    ev=events.map(e=>{
      const x=(e.v/base);
      return `<div class="ev">
        <div class="evd">${fmtD(e.d)}</div>
        <div class="evb"><i style="width:${clamp(e.v/(base*2)*100,10,100)}%;
          background:${scoreColor(e.sc)}"></i></div>
        <div class="evv"><b>${fmt(e.v,1)} ${t('uM')}</b><span>×${x.toFixed(1)}</span></div>
      </div>`}).join('');
  }

  // ocean state
  let ocean='';
  if(OCEANDATA){
    ocean=OCEAN.map((o,i)=>{
      const wh=OCEANDATA.wave[i]?.hourly, wd=OCEANDATA.wind[i]?.hourly;
      if(!wh) return '';
      const pairs=wh.time.map((tm,k)=>({tm, h:wh.wave_height?.[k], w:wd?.wind_speed_10m?.[k]}))
        .filter(x=>x.h!=null);
      if(!pairs.length) return '';
      const peak=pairs.reduce((a,b)=>b.h>a.h?b:a);
      const windPeak=pairs.filter(x=>x.w!=null).reduce((a,b)=>b.w>a.w?b:a,{w:0,tm:''});
      const arrive=new Date(new Date(peak.tm+':00').getTime()+o.lag*3600e3);
      const arrH=String(arrive.getHours()).padStart(2,'0');
      const arrD=arrive.toLocaleDateString(LOCALE[LANG],{day:'numeric',month:'short'});
      const storm=windPeak.w>=13;
      return `<div class="ocn">
        <div class="ocname">${t('oc_'+o.id)}<i>${o.dist} ${t('uKm')}</i></div>
        <div class="ocbody">
          <div>${t('ocPeak', '<b>'+fmt(peak.h,1)+' '+t('uM')+'</b>', fmtD(peak.tm.slice(0,10)))}</div>
          <div class="ocsub">${t('ocArrive','<b>'+fmt(peak.h*o.pass,1)+' '+t('uM')+'</b>',arrD+' '+arrH+':00')}</div>
          <div class="ocsub" style="${storm?'color:var(--bad);font-weight:600':''}">${
            t('ocWind','<b>'+fmt(windPeak.w,0)+' '+t('uMs')+'</b>')}${storm?' · '+t('ocStorm'):''}</div>
        </div></div>`;
    }).join('');
  }

  return `<div class="card"><div class="ihead">${t('iEvents')}</div>${ev}
      <div class="inote2">${t('iEventsNote',fmt(base,1))}</div></div>
    <div class="card"><div class="ihead">${t('iOcean')}</div>${ocean||'<div class="inote">–</div>'}
      <div class="inote2">${t('iOceanNote')}</div></div>
    <div class="card"><div class="ihead">${t('iSeason')}</div>
      <div class="inote">${t('iSeasonText')}</div></div>
    <div class="card"><div class="ihead">${t('iTyphoon')}</div>
      <div class="inote">${t('iTyphoonText')}</div></div>`;
}

/* Одинаковые баллы встречаются часто: модельная сетка грубее, чем
   расстояние между пляжами. Чтобы порядок не прыгал между обновлениями,
   при равенстве сортируем по названию.                              */
function byScoreThenName(a,b){
  // сравниваем по видимому баллу: 4.4 и 3.6 оба показаны как «4»,
  // и порядок между ними выглядел бы случайным
  const d=shown(b.pick.score)-shown(a.pick.score);
  if(d) return d;
  return nameOf(a.sp).localeCompare(nameOf(b.sp),LOCALE[LANG]);
}

/* Полоса пляжей подсвечивает тот, что сейчас на экране. */
let chipObserver=null;
function markVisibleChip(){
  chipObserver?.disconnect();
  const chips=document.getElementById('chips'); if(!chips) return;
  const cards=[...document.querySelectorAll('#main .card[data-id]')];
  chipObserver=new IntersectionObserver(es=>{
    const vis=es.filter(e=>e.isIntersecting)
      .sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top)[0];
    if(!vis) return;
    const id=vis.target.dataset.id;
    chips.querySelectorAll('.chip').forEach(c=>{
      const on=c.dataset.pick===id;
      c.classList.toggle('on',on);
      if(on) c.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});
    });
  },{rootMargin:'-140px 0px -70% 0px'});
  cards.forEach(c=>chipObserver.observe(c));
}

/* Which sources failed, in plain words, above the beaches. */
function troubleNote(){
  const windSpare=STATUS.wind&&!STATUS.wind.ok&&STATUS.metno&&STATUS.metno.ok;
  const lost=SPOTS.filter(s=>!DATA||!DATA[s.id]||!DATA[s.id].length).map(nameOf);
  // running on reserve sources is normal operation, said calmly
  const spare=[];
  const omDown=STATUS.wave&&!STATUS.wave.ok;
  if(WAVE_FALLBACK==='ww3'&&omDown) spare.push(t('spareWave'));
  if(windSpare||(WAVE_FALLBACK==='ww3'&&omDown&&!(STATUS.wind&&STATUS.wind.ok))) spare.push(t('spareWind'));
  // things that have no reserve
  const gaps=[];
  if(STATUS.wind&&!STATUS.wind.ok&&!windSpare) gaps.push(t('noWind'));
  if(STATUS.sea&&!STATUS.sea.ok) gaps.push(t('noSea'));
  if(lost.length&&DATA) gaps.push(t('fewSpots',lost.join(', ')));
  return (spare.length?`<div class="reserve">${t('spareHead')} ${spare.join('; ')}.</div>`:'')+
    (gaps.length?`<div class="stale">${gaps.join(' ')}</div>`:'');
}

    </div>

/* ===== Weather and sunset tabs =====
   Loaded on first open: several weather models at the region point, cloud
   far out west along today's sunset line, aerosols, and MET Norway. Places,
   the Moon and planets are computed and need no network. */
const isSky=()=>TAB==='wx'||TAB==='sun';
let SKY=null, SKY_KEY='', SKY_TIMER=0;
const SKY_YEAR={};
const SKY_NAME={ecmwf_ifs025:'ECMWF',gfs_seamless:'GFS (NOAA)',icon_seamless:'ICON (DWD)',jma_seamless:'JMA',
  gem_seamless:'GEM (Canada)',ukmo_seamless:'UKMO',metno:'MET Norway ⧉',wttr:'wttr.in ⧉'};
/* Every provider is asked by itself and none holds the others back. Open-Meteo
   brings six models but is one host that has gone down before, so MET Norway
   and wttr.in are asked every time and are enough to fill both tabs alone. */
function skyCacheSave(S){
  LS.set('sky_cache_'+S.reg,JSON.stringify({at:S.at,om:S.om,west:S.west,air:S.air,met:S.met,wttr:S.wttr,metWest:S.metWest}));
}
function skyCacheLoad(){
  try{
    const c=JSON.parse(LS.get('sky_cache_'+REGION)||'null');
    if(!c||Date.now()-c.at>CACHE_KEEP) return null;
    const st={}; for(const k of ['om','west','air','met','wttr','metWest']) if(c[k]) st[k]='ok';
    return {...c, reg:REGION, v:0, left:0, st};
  }catch{ return null }
}
function loadSky(){
  // what was loaded on the last visit shows at once and is refreshed behind
  if(!SKY||SKY.reg!==REGION){ const c=skyCacheLoad(); if(c) SKY=c; }
  const old=SKY&&SKY.reg===REGION?SKY:null;
  if(old&&(old.left>0||Date.now()-old.at<CACHE_TTL)) return;
  const R=REG(), sun=sunsetOf(dayOf(Date.now()),R.wxLat,R.wxLon);
  const west=SKY_WEST_KM.map(km=>destPoint(R.wxLat,R.wxLon,sun.az,km));
  const q='&timezone=Asia%2FBangkok&wind_speed_unit=ms', om='https://api.open-meteo.com/v1/forecast?latitude=';
  const met=(lat,lon)=>jget('https://api.met.no/weatherapi/locationforecast/2.0/complete?lat='+lat.toFixed(2)+'&lon='+lon.toFixed(2),undefined,15000);
  // on a refresh the last answers stay on screen until the new ones replace them
  const S=SKY={reg:REGION, at:Date.now(), v:0, left:0, st:{}, om:old&&old.om, west:old&&old.west, air:old&&old.air,
    met:old&&old.met, wttr:old&&old.wttr, metWest:old&&old.metWest};
  const put=(k,p)=>{ S.left++; S.st[k]='wait';
    return p.then(v=>{ S[k]=v||null; },()=>{ S[k]=null; }).then(()=>{
      S.st[k]=S[k]?'ok':'fail'; S.left--; S.v++;
      if(!S[k]) reportFail('sky_'+k);
      if(S.left===0&&(S.om||S.met)) skyCacheSave(S);
      if(SKY===S&&isSky()){ clearTimeout(SKY_TIMER); SKY_TIMER=setTimeout(render,S.left?300:0); }
    }); };
  put('om',jgetOM(om+R.wxLat+'&longitude='+R.wxLon+q+'&forecast_days=10&hourly=temperature_2m,precipitation,cloud_cover,'+
    'cloud_cover_low,cloud_cover_mid,cloud_cover_high,wind_speed_10m,wind_direction_10m,wind_gusts_10m,sunshine_duration'+
    '&models='+SKY_MODELS.join(','),20000));
  put('met',met(R.wxLat,R.wxLon));
  put('wttr',jget('https://wttr.in/'+R.wxLat.toFixed(2)+','+R.wxLon.toFixed(2)+'?format=j1',undefined,15000)
    .then(j=>j&&j.weather&&j.weather.length?j:null));
  put('air',jget('https://air-quality-api.open-meteo.com/v1/air-quality?latitude='+R.wxLat+'&longitude='+R.wxLon+
    '&timezone=Asia%2FBangkok&forecast_days=5&hourly=aerosol_optical_depth'));
  put('west',jgetOM(om+west.map(p=>p[0].toFixed(2)).join(',')+'&longitude='+west.map(p=>p[1].toFixed(2)).join(',')+q+
      '&forecast_days=7&hourly=cloud_cover_low,cloud_cover_mid,precipitation&models='+SKY_WEST_MODELS.join(','),20000)
    .then(w=>[].concat(w)))
    // far-west cloud has a reserve too: the same four points from MET Norway
    .then(()=>{ if(S.west) S.metWest=null;
      else put('metWest',Promise.all(west.map(p=>met(p[0],p[1]).catch(()=>null))).then(a=>a.some(Boolean)?a:null)); });
  // Open-Meteo slow: after 3 s the tab opens on the other providers
  setTimeout(()=>{ if(SKY===S&&isSky()&&S.st.om==='wait') render(); },3100);
}
/* Enough has arrived to draw: Open-Meteo, or everything has answered, or 3 s
   have passed and another provider is in. */
const skyReady=()=>!!SKY&&SKY.reg===REGION&&!!(SKY.om||SKY.left===0||(Date.now()-SKY.at>3000&&(SKY.met||SKY.wttr)));
function paintSky(){
  const main=document.getElementById('main');
  if(typeof sunsetOf==='undefined'||typeof HORIZON==='undefined'){ loadSkyCode(); setTimeout(()=>{ if(isSky()) render(); },150); return; }
  document.getElementById('summary').innerHTML='';
  document.getElementById('rest').innerHTML='';
  document.getElementById('restlbl').textContent='';
  loadSky();
  const ready=skyReady();
  // answers come one by one; redraw on each, and only then
  const key=[TAB,REGION,LANG,ready?SKY.v:-1,DATA?LAST_OK:0].join('|');
  if(key===SKY_KEY&&main.querySelector('.skytab')) return;
  SKY_KEY=key;
  // a redraw must not fold what the reader has opened
  const open=[...main.querySelectorAll('.skytab details[open]')].map(d=>d.dataset.o).filter(Boolean);
  main.innerHTML=`<div class="skytab">${TAB==='wx'?weatherTab(ready):sunsetTab(ready)}</div>`;
  open.forEach(o=>{ const d=main.querySelector(`.skytab details[data-o="${o}"]`); if(d) d.open=true; });
}
/* Which providers answered, and a calm note when the tab runs without
   Open-Meteo. rows: [key in SKY.st, label]. */
function skyStatus(rows){
  const COL={ok:'var(--go)',fail:'var(--bad)',wait:'var(--dim2)'};
  return `<div class="stat">${rows.filter(([k])=>SKY.st[k]).map(([k,label])=>{ const st=SKY.st[k];
    return `<div class="stline"><span class="sdot" style="background:${COL[st]}"></span>${label}
      <b style="color:${st==='fail'?'var(--bad)':'var(--dim)'}">${st==='ok'?'ok':st==='wait'?'…':t('noData').trim().replace(/\.$/,'')}</b></div>`; }).join('')}</div>`;
}
const skySpare=k=>SKY.st.om==='fail'?`<div class="reserve" style="margin:10px 0">${t(k)}</div>`:'';
const skyLoader=k=>`<div class="loader"><span class="dots"><i></i><i></i><i></i></span>${t(k)}</div>`;
const dayName=(day,opt)=>new Date(day+'T12:00:00').toLocaleDateString(LOCALE[LANG],opt);
const monName=i=>{ const d=new Date(2024,i,15);
  return LANG==='th'?d.toLocaleDateString('th-TH',{month:'short'}):d.toLocaleDateString(LOCALE[LANG],{month:'long'}).slice(0,3); };
const badge=color=>`background:color-mix(in srgb,${color} 14%,transparent);color:${color}`;

/* Best wave score of a local day across the beaches that take part in the top. */
function waveOfDay(day){
  if(!DATA) return null;
  let best=null;
  for(const sp of SPOTS){
    if(sp.noTop||!DATA[sp.id]) continue;
    for(const r of DATA[sp.id])
      if(r.t.startsWith(day)&&isDay(r)&&r.score!=null&&(!best||r.score>best.r.score)) best={sp,r};
  }
  return best;
}
const WX_ROWS=()=>[['om',t('stOM')],['met','MET Norway'],['wttr','wttr.in']];
/* One line naming the providers; a silent one is struck through. */
const skyLine=rows=>`<div class="inote2">${t('skSrc')}: ${rows.filter(([k])=>SKY.st[k]).map(([k,label])=>
  SKY.st[k]==='fail'?`<s style="color:var(--bad)">${label}</s>`:label).join(' · ')}</div>`;
const WX_ICON={sun:'☀',part:'⛅',cloud:'☁',shower:'🌦',rain:'🌧',storm:'⛈'};
const WX_KEY={sun:'kSun',part:'kPart',cloud:'kCloud',shower:'kShower',rain:'kRain',storm:'kStorm'};
function weatherTab(ready){
  if(!ready) return skyLoader('wxLoading');
  const days=weatherDays(SKY,REGION,10);
  if(!days.length) return `<div class="err">${t('wxNone')}</div>`+skyLine(WX_ROWS());
  const R=REG(), mm=v=>v<1?'<1':String(Math.round(v));
  const rainTxt=d=>isDryKind(d.kind)?t('wxDryDay')
    :d.rainH!=null&&Math.round(d.rainH)>0?t('wxRainDay',mm(d.rain),Math.round(d.rainH)):t('wxRainMm',mm(d.rain));
  const waves=days.map(d=>waveOfDay(d.day)), anyWave=waves.some(Boolean);
  const rows=days.map((d,di)=>{
    const w=waves[di];
    const strip=d.hours.some(v=>v!=null&&v>=0.1)
      ? `<div class="wxcap">${t('wxHours')}</div><div class="wxhours">${d.hours.map((v,i)=>
          `<div class="wxh"><em>${v!=null&&v>=WX_TUNE.wet?fmt(v,1):''}</em><i>${
            v!=null&&v>=0.1?`<b style="height:${Math.max(2,Math.round(clamp(v/4,0,1)*24))}px"></b>`:''}</i>${
            String(R.dayFrom+i).padStart(2,'0')}</div>`).join('')}</div>`
      : '';
    const src=[...SKY_MODELS,'metno','wttr'].filter(m=>d.src[m]).map(m=>{ const x=d.src[m];
      return `<tr><td>${SKY_NAME[m]}</td><td>${WX_ICON[x.kind]||'·'}</td><td>${fmt(x.tMax,0)}/${fmt(x.tMin,0)}</td>
        <td>${fmt(x.rain,1)}</td><td>${x.rainH==null?'–':x.rainH}</td>
        <td>${x.wdir==null?'':dirRu(x.wdir)+' '}${fmt(x.wind,0)}</td></tr>`; }).join('');
    return `<details class="dayx" data-o="wx${d.day}"><summary class="day">
        <div class="dn"><b>${dayName(d.day,{weekday:'short'})}</b>${dayName(d.day,{day:'numeric',month:'short'})}</div>
        <div class="wxi">${WX_ICON[d.kind]}</div>
        <div class="wxm"><b>${t(WX_KEY[d.kind])}</b>
          <span>${rainTxt(d)} · ${d.wdir==null?'':dirRu(d.wdir)+' '}${fmt(d.wind,0)}</span></div>
        <div class="wxt"><b>${fmt(d.tMax,0)}°</b><span>${fmt(d.tMin,0)}°</span></div>
        ${w?`<div class="wxw" style="${badge(scoreColor(w.r.score))}">${shown(w.r.score)}</div>`:anyWave?'<div class="wxw"></div>':''}
      </summary><div class="daybody">
        <div class="wxcap"><b>${t('wxVoteDry',d.dry,d.n)}</b>${d.gust==null?'':' · '+t('wxGust',fmt(d.gust,0))}</div>
        ${strip}
        <table class="stab c6"><thead><tr><th>${t('colSrc')}</th><th></th><th>${t('colT')}</th><th>${t('colRain')}</th>
          <th>${t('colRainH')}</th><th>${t('wind')}</th></tr></thead><tbody>${src}
          <tr class="avgrow"><td>${t('median')}</td><td>${WX_ICON[d.kind]}</td><td>${fmt(d.tMax,0)}/${fmt(d.tMin,0)}</td>
            <td>${fmt(d.rain,1)}</td><td>${d.rainH==null?'–':Math.round(d.rainH)}</td>
            <td>${d.wdir==null?'':dirRu(d.wdir)+' '}${fmt(d.wind,0)}</td></tr></tbody></table>
        ${w?`<div class="wxcap" style="padding-bottom:9px">${t('wxWave',shown(w.r.score),nameOf(w.sp)+', '+
          fmt(w.r.swell,1)+' '+t('uM'),scoreColor(w.r.score))}</div>`:''}
      </div></details>`;
  }).join('');
  // the column labels say what the numbers are, so the rows need no words
  const head=`<div class="day wxhd"><div class="dn"></div><div class="wxi"></div><div class="wxm">${t('wxCols')}</div>
    <div class="wxt">°C</div>${anyWave?`<div class="wxwh">${t('wave')}</div>`:''}</div>`;
  return `${skySpare('skySpareWx')}<div class="card"><div class="ihead">${t('wxHead',Math.max(...days.map(d=>d.n)))}</div>
    <div class="days" style="border-top:0">${head}${rows}</div></div>${skyLine(WX_ROWS())}`;
}

/* The view west from one standing point: land above the sea horizon and where
   the sun goes down today. 5 px per degree of compass, land height is drawn
   three times taller than wide so low islands stay visible. */
function panorama(prof,azNow){
  const x=a=>10+(a-HZ.from)*5, y0=50, y=a=>y0-Math.min(a,11)*3.2;
  let land=`M${x(HZ.from)} ${y0}`;

/* A small OpenStreetMap picture for an opened sunset place: where to stand

  el.dataset.done='1';

  // Web Mercator: the place in pixels of the whole world at this zoom

      <line class="ray bg" ${from} x2="${at(edge)}"/>
      <line class="ray${hit<edge?' off':''}" ${from} x2="${at(edge)}"/>
      ${hit<edge?`<line class="ray" ${from} x2="${at(hit)}"/><circle class="stop" ${P(hit)} r="4.5"/>`:''}

/* The last good forecast is kept in the browser. On the next visit it is on

const CACHE_TTL=30*60*1000, CACHE_KEEP=12*60*60*1000;
const CACHE_V=(s=>{ let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))|0; return h; })(

const RETRY_S=[60,120,300,600];

const KEEP_FULL=6*60*60*1000;

function cacheSave(d){

    LS.set('data_cache_'+REGION,JSON.stringify({v:CACHE_V,at:Date.now(),weather:WEATHER,ocean:OCEANDATA,data:slim}));

function cacheLoad(){

async function boot(force){

    LAST_OK=cached.at; STALE=false; render(); startCams();

  // fresh cache and nothing forcing a refresh: no network at all
  if(fresh && !force) return;
  // with a forecast on screen the quick 2-day request and the rough first paint are not needed
  const painted=!!DATA;
  LOADING=true;
  // rolling wave, so a slow answer does not look like a frozen page
  if(!DATA){
    document.getElementById('main').innerHTML=
      `<div class="loader pen"><i class="wavepen" aria-hidden="true"></i>${t('loading')}</div>`+'<div class="skel"></div>'.repeat(3);
    // a long wait should not look like a frozen page

      if(l&&!DATA) l.insertAdjacentHTML('afterend',`<p class="slow">${t('slowLoad')}</p>`); },5000);
    // safety net: whatever hangs, after 20 s the page says so instead of spinning

    const spareP=spareCore();

    const omP=new Promise((res,rej)=>{

    if(DATA){ render(); startCams(); } else renderOutage();
    // a rate limit is not cured by asking again every minute
    setTimeout(()=>boot(true),(STALE_REASON==='rateLimit'?RETRY_S[Math.min(RETRY++,RETRY_S.length-1)]:60)*1000);
  }finally{
    LOADING=false;
    if(moved()) boot(true);
  }
}
/* Re-render without touching camera players. Replacing innerHTML recreates the
   iframes, so every render restarted the video streams: two renders per load
   (core, then extras) and a third from cache meant the cameras loaded up to
   three times. Cards with the same order and camera are patched in place:
   everything around the .cam node is swapped, the .cam node itself stays. */
function patchCards(container, html){
  // <template> content is inert: images inside it do not start loading
  const tmp=document.createElement('template'); tmp.innerHTML=html;
  const next=[...tmp.content.children], prev=[...container.children];
  const sameShape = next.length===prev.length && next.every((n,i)=>{
    const o=prev[i];
    return n.dataset.id && o.dataset && n.dataset.id===o.dataset.id &&
      (n.querySelector('.cam')?.dataset.src||'') === (o.querySelector('.cam')?.dataset.src||'');
  });
  if(!sameShape){ container.innerHTML=html; return; }
  next.forEach((n,i)=>{
    const o=prev[i];
    const ocam=o.querySelector('.cam');
    if(!ocam){ o.replaceWith(document.importNode(n,true)); return; }
    o.className=n.className;
    const oh=o.querySelector(':scope > .chead'), nh=n.querySelector(':scope > .chead');
    if(oh&&nh) oh.replaceWith(document.importNode(nh,true));
    const ob=o.querySelector(':scope > .cbody'), nb=n.querySelector(':scope > .cbody');
    const ncam=nb.querySelector(':scope > .cam');
    [...ob.children].forEach(ch=>{ if(ch!==ocam) ch.remove(); });
    let before=true;
    [...nb.children].forEach(ch=>{
      if(ch===ncam){ before=false; return; }
      const node=document.importNode(ch,true);
      before ? ob.insertBefore(node,ocam) : ob.appendChild(node);
    });
  });
}

/* Fill lazy <details> on first open. toggle does not bubble, so listen in capture. */
document.addEventListener('toggle',e=>{
  const d=e.target;
  if(!d.classList||!d.classList.contains('lazy')||!d.open||d.dataset.done||!DATA) return;
  const sp=SPOTS.find(x=>x.id===d.dataset.s), rows=sp&&DATA[sp.id];
  if(!rows) return;
  const i0=+d.dataset.i0, r=rows[+d.dataset.r]||rows[i0];
  // the badge shows a whole number; the unrounded score is here for an honest look
  const exact=r.score==null?'':`<p class="exact">${t('exact')}: <b style="color:${scoreColor(r.score)}">${(Math.floor(r.score*10+1e-9)/10).toFixed(1)}</b> / 10</p>`;
  const html = d.dataset.k==='day'  ? hourStrip(rows,i0)+timing(sp,rows,i0)+why(sp,r)+sources(r)
             : d.dataset.k==='row'  ? exact+(sp.beach?`<p class="beach">${t('beach')}: <b>${sp.beach[LANG]||sp.beach.en}</b></p>`:'')+camBlock(sp)+timing(sp,rows,i0)+hourStrip(rows,i0)+why(sp,r)+sources(r)
             : exact+hourStrip(rows,i0)+why(sp,r)+sources(r);
  d.querySelector('.lz').innerHTML=html;
  d.dataset.done='1';
},true);

/* Language-dependent labels. */
function syncHeights(){
  const h=document.querySelector('header')?.offsetHeight||0;
  const c=document.querySelector('.chips')?.offsetHeight||0;
  document.documentElement.style.setProperty('--headH',h+'px');
  document.documentElement.style.setProperty('--stickH',(h+c)+'px');
}
addEventListener('resize',syncHeights);

function applyLang(){
  document.documentElement.lang=LANG;
  document.getElementById('logo').innerHTML=
    `Surf<button class="reg" id="regbtn" aria-haspopup="true">${regName()} ▾</button>
     <div class="regmenu" id="regmenu" hidden>${Object.keys(REGIONS).map(k=>
       `<a href="#${k}" class="${k===REGION?'on':''}">${REGIONS[k].name[LANG]||REGIONS[k].name.en}</a>`).join('')}</div>`;
  document.getElementById('regbtn').onclick=e=>{e.stopPropagation();
    const m=document.getElementById('regmenu'); m.hidden=!m.hidden;};
  document.title='Surf · '+regName();
  document.getElementById('howlink').textContent=t('howLink');
  document.getElementById('histlink').textContent=t('histLink');
  document.getElementById('histlink').href='history.html#'+REGION;
  const map={now:'now',island:'island',d7:'d7',wx:'wx',sun:'sun'};
  document.querySelectorAll('.tab').forEach(b=>b.textContent=b.dataset.t==='island'?regName():t(map[b.dataset.t]));
  document.querySelectorAll('#lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===LANG));
}
applyLang();
document.querySelectorAll('#lang button').forEach(b=>b.onclick=()=>{
  LANG=b.dataset.l; LS.set('lang',LANG); applyLang(); render();
  gtag('set','user_properties',{ui_lang:LANG}); track('lang_set',{lang:LANG});
});

document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); TAB=b.dataset.t; render(); window.scrollTo({top:0,behavior:'smooth'});
});
boot(true);
// a tab nobody is looking at asks nothing; it catches up when it is opened again
setInterval(()=>{ if(!document.hidden) boot(true); },1800000);
// refresh still frames more often than the page
setInterval(()=>document.querySelectorAll('.camimg').forEach(img=>{
  img.src=`https://imgproxy.windy.com/_/preview/plain/current/${img.dataset.cam}/original.jpg?v=${Date.now()}`;
}),45000);
document.addEventListener('click',()=>{const m=document.getElementById('regmenu'); if(m) m.hidden=true;});
addEventListener('hashchange',()=>{
  const h=(location.hash||'').replace('#','').toLowerCase();
  if(REGIONS[h]&&h!==REGION){ REGION=h; SPOTS=spotsOf(REGION); DATA=null; WEATHER=null; OCEANDATA=null; SKY=null; SKY_KEY='';
    PICK=null; document.getElementById('main').innerHTML=''; applyLang(); boot(true); track('region_open',{}); }
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)boot()});

/* Analytics events. Camera players are cross-origin, so playback itself is
   invisible to us: "seen" means 5 s on screen, "tap" means focus moved into
   the player. */
const spotOf=el=>el.closest('[data-id]')?.dataset.id||el.closest('[data-s]')?.dataset.s||el.closest('[data-sp]')?.dataset.sp||'';
// which of its neighbours a folded block is: the day ahead, for lists of days
const nth=d=>[...d.parentElement.children].filter(x=>x.tagName==='DETAILS').indexOf(d);
document.addEventListener('click',e=>{
  const el=e.target, b=el.closest('.tab');
  if(b&&b.dataset.t!=='now') track('tab_open',{tab:b.dataset.t});
  const m=el.closest('a.map');
  if(m){ const pl=m.closest('details[data-o^="pl"]');
    track('map_open',pl?{place:pl.dataset.o.slice(2),kind:'sunset'}:{place:spotOf(m),kind:'beach'}); }
  if(el.closest('.retry')) track('retry_tap',{});
  const chip=el.closest('.chip');
  if(chip) trackOnce('chip_tap',{beach:chip.dataset.pick},chip.dataset.pick);
},true);
document.addEventListener('toggle',e=>{
  const d=e.target; if(!d.open||!d.dataset) return;
  const k=d.dataset.k, o=d.dataset.o||'';
  if(k==='more'||k==='row') track('beach_open',{beach:d.dataset.s});
  else if(k==='day') trackOnce('day_open',{beach:d.dataset.s,day_ahead:nth(d)},d.dataset.s+nth(d));
  else if(o==='src') trackOnce('sources_open',{where:'sunset'},'sunset');
  else if(o==='why'||o==='plrest') trackOnce('fold_open',{what:o},o);
  else if(o.startsWith('wx')) trackOnce('wx_day_open',{day_ahead:nth(d)},o);
  else if(o.startsWith('pl')) trackOnce('place_open',{place:o.slice(2)},o);
  else if(d.classList.contains('srcbox')) trackOnce('sources_open',{where:'wave',beach:spotOf(d)},'wave'+spotOf(d));
},true);
const camSeen={}, camSent=new Set();
setInterval(()=>{
  if(document.hidden) return;
  document.querySelectorAll('.cam').forEach(c=>{
    const id=spotOf(c), r=c.getBoundingClientRect();
    if(!id||camSent.has(id)||!r.height) return;
    const vis=Math.min(r.bottom,innerHeight)-Math.max(r.top,0);
    camSeen[id]=vis>=r.height/2?(camSeen[id]||0)+1:0;
    if(camSeen[id]>=5){ camSent.add(id); track('cam_seen',{beach:id}); }
  });
},1000);
addEventListener('blur',()=>setTimeout(()=>{
  const f=document.activeElement;
  if(f&&f.tagName==='IFRAME'&&f.closest('.cam')) track('cam_tap',{beach:spotOf(f)});
}));
</script>
