<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Page not found · Surf</title>
<link rel="icon" type="image/png" href="/favicon.png">
<script>
  // same stored theme and language as the main page
  try{ if(localStorage.getItem('theme')==='dark') document.documentElement.dataset.theme='dark'; }catch(e){}
  try{ var l=localStorage.getItem('lang')||(navigator.language||'').slice(0,2).toLowerCase();
    if(l==='ru'||l==='th') document.documentElement.lang=l; }catch(e){}
</script>
<style>
:root{--bg:#f2f5f9;--tx:#0f1b2d;--dim:#4a5a6e;--acc:#0b7fc7}
:root[data-theme="dark"]{--bg:#0a0e14;--tx:#e8eef6;--dim:#94a3b8;--acc:#38b6ff}
html,body{margin:0;background:var(--bg);color:var(--tx)}
body{font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:560px;margin:0 auto;padding:18vh 16px 40px;text-align:center}
h1{font-size:24px;margin:0 0 6px;letter-spacing:-.3px}
p{color:var(--dim);margin:0 0 22px}
a{color:var(--acc);text-decoration:none;font-weight:650}
.go{display:inline-block;background:var(--acc);color:#fff;padding:11px 18px;border-radius:11px;margin:0 0 16px}
[data-l]{display:none}
html[lang="en"] [data-l="en"],html[lang="ru"] [data-l="ru"],html[lang="th"] [data-l="th"]{display:revert}
</style>
</head>
<body>
<main>
  <h1><span data-l="en">No such page</span><span data-l="ru">Такой страницы нет</span><span data-l="th">ไม่พบหน้านี้</span></h1>
  <p><span data-l="en">The address is wrong or the page has moved.</span><span data-l="ru">Адрес с ошибкой, или страница переехала.</span><span data-l="th">ที่อยู่ไม่ถูกต้อง หรือหน้านี้ถูกย้ายแล้ว</span></p>
  <a class="go" href="/"><span data-l="en">Phuket surf forecast →</span><span data-l="ru">Прогноз волн на Пхукете →</span><span data-l="th">พยากรณ์คลื่นภูเก็ต →</span></a>
  <div><a data-l="en" href="/en/">Guides</a><a data-l="ru" href="/ru/">Статьи</a><a data-l="th" href="/en/">Guides</a></div>
</main>
</body>
</html>
